[build]
builder = "nixpacks"
buildCommand = "cd backend && python -m pip install --upgrade pip && python -m pip install -r requirements.txt"

[deploy]
startCommand = "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[env]
PYTHONUNBUFFERED = "1"
