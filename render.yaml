services:
  # ── Backend API (Docker) ───────────────────────────────────────────────────
  - type: web
    name: TrendSense
    env: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render dashboard → Environment
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: NEWS_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: PIPELINE_API_KEY
        sync: false
      - key: PIPELINE_DOMAINS
        value: AI,Fintech,Health,Biotech,Climate,Crypto
      - key: PIPELINE_SCHEDULE_MINUTES
        value: "720"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///trendsense.db
      - key: CORS_ORIGINS
        value: https://trendsense-v1.onrender.com,https://trendsense.onrender.com,http://localhost:5173
      - key: NOTIFICATION_TVS_DELTA_THRESHOLD
        value: "5.0"

  # ── Frontend Static Site ───────────────────────────────────────────────────
  - type: web
    name: TrendSense_v1
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://trendsense.onrender.com
