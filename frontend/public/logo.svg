<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Violet rounded-rect background -->
  <rect width="32" height="32" rx="8" fill="#6d28d9"/>
  <!-- Signal line: starts bottom-left, dips slightly, curves sharply upward -->
  <path
    d="M5 22 Q7 24 9 21 Q11 18 14 22 C17 26 20 14 27 6"
