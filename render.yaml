services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: trendsense-api
    env: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    # Render free tier: 512 MB RAM — single worker SQLite is fine for MVP
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: NEWS_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: PIPELINE_API_KEY
        sync: false
      - key: PIPELINE_DOMAINS
        value: AI,Fintech,Health,Biotech,Climate,Crypto
      - key: PIPELINE_SCHEDULE_MINUTES
        value: "720"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///trendsense.db
      # CORS: allow the Render frontend URL + localhost dev
      # Replace YOUR-APP-NAME with the actual Render static site URL after first deploy
      - key: CORS_ORIGINS
        value: https://trendsense.onrender.com,http://localhost:5173,http://localhost:3000
      - key: NOTIFICATION_TVS_DELTA_THRESHOLD
        value: "5.0"

  # ── Frontend Static Site ───────────────────────────────────────────────────
  - type: web
    name: trendsense
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA fallback — all paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point frontend at the Render backend URL
      # Replace YOUR-API-NAME with your Render API service URL after first deploy
      - key: VITE_API_URL
        value: https://trendsense-api.onrender.com
