services:
  - type: web
    name: trendsense-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health

databases:
  - name: trendsense-db
    databaseName: trendsense
    user: trendsense
